name: asciicrystal-epub3
version: 2.3.0.5

description: |
  AsciiDoc to EPUB3 converter for Crystal, equivalent of the asciidoctor-epub3 Ruby gem.
  Depends on asciicrystal (parser/AST).
  Ported from Ruby asciidoctor-epub3 2.3.0 (2025-08-31).

authors:
  - Philippe Nénert <philippe@aloli.fr>

license: MIT

# Pour le développement local, remplacer par :
#   asciicrystal:
#     path: ../asciicrystal
dependencies:
  asciicrystal:
    github: aloli-crystal/asciicrystal
    version: "~> 2.0.26.12"
  rouge:
    github: aloli-crystal/rouge
    version: "~> 4.7.0.3"

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"

targets:
  asciicrystal-epub3:
    main: bin/asciicrystal-epub3

crystal: ">= 1.19.0"
